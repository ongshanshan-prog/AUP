<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Case of Ah Pad</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@500;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap">
<style>
/* Layout: one centred "case desk" column; the speaker sits beside a speech bubble, cards stack below. */
:root{
  /* Midnight Case File: one committed dark look (night navy, electric violet, evidence yellow, alarm red, clear mint) */
  --bg:#12131F; --ink:#F2F3FF; --muted:#A3A8C7; --card:#1D2033; --line:#2E3352; --soft:#272B45;
  --pad:#7C5CFF; --pad-deep:#4E33C9; --screen:#EEE9FF; --face:#1A1530; --blush:#FF8FB1; --hl:#FFFFFF;
  --sun:#FFD23F; --sun-ink:#2A2000; --good:#2EE6A6; --good-ink:#06261C; --good-soft:#12352C; --bad:#FF4D6D; --bad-soft:#3A1726;
  --shadow:rgba(0,0,0,.5); --tile:#0A0B14; --tile-ink:#F2F3FF; --skin:#F1C7A0; --hair:#2B2230; --pj1:#F7A8C0; --pj2:#FFF4F8;
  --chat:#163A30; --chat-ink:#F2F3FF; --on-pad:#FFFFFF; --opt:#171A2B;
  --paper:#F3EFE4; --paper-ink:#1F1B2E; --paper-muted:#6B6580;
  --f-title:"Bebas Neue", Impact, "Arial Narrow", sans-serif;
  --f-display:"Nunito", "Helvetica Neue", Arial, system-ui, sans-serif;
  --f-body:"Nunito", "Helvetica Neue", Arial, system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding-block:18px 56px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(34px,7vw,54px);font-weight:800;letter-spacing:-.01em}
h2{font-size:clamp(24px,4.5vw,32px);font-weight:700}
h3{font-size:20px;font-weight:700}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.muted{color:var(--muted)}
section{display:flex;flex-direction:column;gap:12px}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
.topbar .mono{color:var(--muted)}
.clock{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:13px;font-weight:600;background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:4px 10px;font-variant-numeric:tabular-nums}
.clock b{color:var(--bad);font-size:15px}
.clock b{color:var(--pad-deep)}
.clock.calm b{color:var(--good)}
.clock.urgent{border-color:var(--bad);animation:clockpulse 1s ease-in-out infinite}
.clock.urgent b{color:var(--bad)}
@keyframes clockpulse{50%{transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){.clock.urgent{animation:none}}
.meter{display:flex;align-items:center;gap:10px;min-width:0}
.meter-bar{width:110px;height:10px;border-radius:99px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.meter-bar i{display:block;height:100%;background:var(--pad);border-radius:99px;transition:width .5s ease}
.linkbtn{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;padding:4px}

/* stage */
.stage{display:grid;grid-template-columns:170px minmax(0,1fr);gap:18px;align-items:end}
.stage > svg{width:100%;height:auto}
.stage .person{width:78%;justify-self:center;margin-bottom:40px}
.bubble{position:relative;background:var(--card);border:2px solid var(--ink);border-radius:22px;padding:16px 20px 18px;display:flex;flex-direction:column;gap:6px;margin-bottom:56px;box-shadow:4px 5px 0 var(--shadow)}
.bubble::before{content:"";position:absolute;left:-14px;bottom:22px;width:22px;height:22px;background:inherit;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg) skew(8deg,8deg)}
.bubble .who{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--pad);display:flex;gap:8px;flex-wrap:wrap}
.bubble .who span{color:var(--muted)}
.bubble p{font-size:18px}
.bubble.chat{background:var(--chat);color:var(--chat-ink);border-radius:22px 22px 22px 6px}
.bubble.chat .who{color:var(--good)}
.bubble.danger{border-color:var(--bad)}
.bubble.danger::before{border-color:var(--bad)}
.bubble.danger .who{color:var(--bad)}
@media (max-width:600px){
  .stage{grid-template-columns:100px minmax(0,1fr);gap:12px}
  .stage .person{margin-bottom:24px;width:90%}
  .bubble{margin-bottom:28px;padding:12px 14px 14px}
  .bubble p{font-size:16px}
}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--pad)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:16px}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted)}
.prompt{font-size:19px;font-weight:700;line-height:1.4}
.hint{font-size:15px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:13px 16px;min-height:54px;cursor:pointer;transition:border-color .15s, background .15s, transform .1s}
.opt:hover:not(:disabled){border-color:var(--pad)}
.opt:active:not(:disabled){transform:scale(.99)}
.opt:focus-visible,.btn:focus-visible,.chip:focus-visible,.linkbtn:focus-visible,input:focus-visible,.file:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.opt .key{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:600;background:var(--card);border:1.5px solid var(--line)}
.opt.sel{border-color:var(--pad);background:var(--soft)}
.opt.sel .key{background:var(--pad);color:var(--on-pad);border-color:var(--pad)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .key{background:var(--good);color:var(--on-pad);border-color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);color:var(--on-pad);border-color:var(--bad)}
.opt:disabled{cursor:default}

.fb{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;border:2px solid}
.fb.ok{background:var(--good-soft);border-color:var(--good)}
.fb.no{background:var(--bad-soft);border-color:var(--bad)}
.fb strong{font-family:var(--f-display);font-size:20px}
.fb.ok strong{color:var(--good)} .fb.no strong{color:var(--bad)}
.fb ul{margin:4px 0 0;padding-left:20px}

.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.btn{font-family:var(--f-display);font-weight:700;font-size:19px;border:0;border-radius:99px;padding:12px 26px;min-height:50px;cursor:pointer;background:var(--pad);color:var(--on-pad);box-shadow:0 4px 0 var(--pad-deep);transition:transform .1s, box-shadow .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pad-deep)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* sign in */
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-weight:700}
.field-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.6fr);gap:14px;align-items:start}
.field-row .field{min-width:0}
.field-row input{width:100%}
@media (max-width:420px){.field-row{grid-template-columns:1fr}}
input[type=text]{font:inherit;font-size:19px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.err{color:var(--bad);font-size:15px}

/* hero */
.hero{display:flex;flex-direction:column;gap:10px;padding-top:6px}
.tag{display:inline-flex;align-self:flex-start;gap:8px;align-items:center;background:var(--bad);color:var(--on-pad);border-radius:8px;padding:4px 10px;font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.hero h1 span{color:var(--pad)}

/* suspects */
.suspects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:680px){.suspects{grid-template-columns:1fr}}
.sus{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:start}
.sus svg{width:64px;height:64px}
.sus h3{font-size:18px}
.sus p{font-size:14.5px;color:var(--muted)}
.sus .why{color:var(--ink);font-size:14px;font-style:italic}
.st-pill{display:inline-block;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:6px;margin:4px 0;background:var(--soft);color:var(--muted)}
.st-suspicious,.st-prime{background:var(--bad);color:var(--on-pad)}
.st-involved{background:var(--sun);color:var(--sun-ink)}
.st-cleared{background:var(--good);color:var(--on-pad)}
.st-less{background:var(--good-soft);color:var(--good)}
.sus.prime{border-color:var(--bad)}

/* persona picker */
.personas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.persona{display:flex;flex-direction:column;align-items:center;gap:8px;font:inherit;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:20px;padding:18px 12px 16px;cursor:pointer;transition:transform .15s,border-color .15s}
.persona:hover{transform:translateY(-2px);border-color:var(--pad)}
.persona:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.persona img{height:260px;max-width:100%;width:auto;object-fit:contain}
.persona .pname{font-family:var(--f-display);font-weight:800;font-size:22px}
.persona .pcheck{font-size:14px;font-weight:700;color:var(--muted)}
.persona.sel{border-color:var(--pad);box-shadow:0 5px 0 var(--pad-deep);background:var(--soft)}
.persona.sel .pcheck{color:var(--pad)}
.persona .powner{font-size:13.5px;color:var(--muted)}
@media (max-width:520px){.persona img{height:180px}.persona .pname{font-size:18px}}
.stage svg.chibi{width:100%;max-width:150px;height:auto;max-height:280px;justify-self:center;margin-bottom:0}
.stage img.mascot{width:100%;max-width:150px;height:auto;max-height:280px;object-fit:contain;justify-self:center;margin-bottom:0}

/* reason checklist */
.reasons{display:flex;flex-direction:column;gap:10px}
.reason{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 16px;width:100%}
.reason .num{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:17px;background:var(--soft);color:var(--pad)}
.reason .rq{display:flex;flex-direction:column;gap:2px;min-width:0}
.reason .rq .mono{color:var(--muted);font-size:11.5px}
.reason .rq b{font-size:17px}
.reason.next{border-color:var(--pad);cursor:pointer;box-shadow:0 4px 0 var(--pad-deep)}
.reason.next:hover{transform:translateY(-1px)}
.reason.next .num{background:var(--pad);color:var(--on-pad)}
.reason.done .num{background:var(--good);color:var(--on-pad)}
.reason.locked{opacity:.55;border-style:dashed}
.reason .go{color:var(--pad);font-weight:800;white-space:nowrap}
.reason .lock{color:var(--muted);font-weight:700}
.vstamp{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:6px;border:2px solid;text-align:center;max-width:170px}
.vstamp.clear{color:var(--good);border-color:var(--good)}
.vstamp.note{color:var(--sun-ink);background:var(--sun);border-color:var(--sun)}
.vstamp.key{color:var(--on-pad);background:var(--bad);border-color:var(--bad)}
@media (max-width:560px){.reason{grid-template-columns:32px minmax(0,1fr)}.reason .num{width:32px;height:32px;font-size:15px}.reason > :last-child{grid-column:2;justify-self:start}}
.checking{display:flex;flex-direction:column;gap:2px;background:var(--card);border:2px dashed var(--pad);border-radius:12px;padding:10px 14px;align-self:flex-start}
.checking .mono{color:var(--pad);font-size:11.5px}
.checking b{font-size:18px}

/* memory board */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.file{display:flex;flex-direction:column;gap:6px;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;min-height:112px;transition:transform .15s}
.file .mono{color:var(--muted);font-size:11.5px}
.file h3{font-size:18px}
.file .st{margin-top:auto;font-size:14px;font-weight:700}
.file.done{border-color:var(--good)} .file.done .st{color:var(--good)}
.file.next{border-color:var(--pad);cursor:pointer;box-shadow:0 4px 0 var(--pad-deep)}
.file.next .st{color:var(--pad)}
.file.next:hover{transform:translateY(-2px)}
.file.locked{opacity:.55;border-style:dashed}
.file.locked .st{color:var(--muted)}

/* evidence */
.evi-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.evi{position:relative;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:6px;box-shadow:0 2px 0 var(--shadow)}
.evi:nth-child(odd){transform:rotate(-.6deg)} .evi:nth-child(even){transform:rotate(.5deg)}
.evi .mono{color:var(--muted);font-size:11px}
.evi p{font-size:15.5px}
.stamp{align-self:flex-start;font-family:var(--f-mono);font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border:2px solid;border-radius:6px;transform:rotate(-3deg)}
.stamp.clear{color:var(--good);border-color:var(--good)}
.stamp.note{color:var(--sun-ink);background:var(--sun);border-color:var(--sun)}
.stamp.key{color:var(--on-pad);background:var(--bad);border-color:var(--bad)}
.evi.big{transform:none;border:2px solid var(--ink);padding:22px}
.evi.big p{font-size:18px}

/* memory playback */
.playback{background:var(--tile);color:var(--tile-ink);border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.playback .mono{opacity:.75}
.playback p{font-size:18px}
.playback::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 2px,transparent 2px 5px);pointer-events:none}
.updates{display:flex;flex-direction:column;gap:8px}
.upd{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:15.5px}

/* scene header */
.scene-head{display:flex;flex-direction:column;gap:6px}
.pill{align-self:flex-start;font-size:13px;font-weight:700;border-radius:99px;padding:3px 12px;background:var(--soft);color:var(--pad)}
.restore{height:6px;border-radius:99px;background:var(--soft);overflow:hidden;max-width:260px}
.restore i{display:block;height:100%;background:var(--pad);width:100%;animation:restore 1.1s ease-out}
@keyframes restore{from{width:0}to{width:100%}}
.glitch{animation:glitch .6s steps(2) 1}
@keyframes glitch{0%{transform:translateX(-3px);opacity:.6}50%{transform:translateX(3px)}100%{transform:none;opacity:1}}

/* mock video call */
.call{background:var(--tile);color:var(--tile-ink);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.call-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;opacity:.85;font-family:var(--f-mono)}
.video{position:relative;aspect-ratio:16/10;max-width:100%;border-radius:12px;overflow:hidden;background:#C9D6E8}
.video svg.vperson{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:82%;width:auto}
.chip{font:inherit;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:10px;border:2px dashed rgba(255,255,255,.75);background:rgba(16,22,44,.78);color:#fff;cursor:pointer;min-height:38px}
.chip.flag{border-style:solid;border-color:var(--sun);background:var(--sun);color:var(--sun-ink)}
.chip.right{border-style:solid;border-color:var(--good);background:var(--good);color:#fff}
.chip.wrong{border-style:solid;border-color:var(--bad);background:var(--bad);color:#fff}
.chip.missed{border-style:solid;border-color:var(--sun);background:rgba(16,22,44,.85);color:var(--sun)}
.chip:disabled{cursor:default}
.video .chip{position:absolute}
.c-tl{top:8px;left:8px}.c-tr{top:8px;right:8px}.c-bl{bottom:8px;left:8px}.c-br{bottom:8px;right:8px}
.call-extra{display:flex;flex-wrap:wrap;gap:8px}
.chatline{display:flex;flex-direction:column;gap:6px;background:rgba(255,255,255,.07);border-radius:10px;padding:10px}
.chatline .mono{opacity:.7;font-size:11px}
.call-tools{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;opacity:.8}
.call-tools span{border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:4px 10px}
@media (max-width:520px){ .video .chip{font-size:12px;padding:5px 8px;min-height:32px} }

/* central message */
.motto{background:var(--pad);color:var(--on-pad);border-radius:24px;padding:26px 24px;display:flex;flex-direction:column;gap:10px}
.motto .mono{opacity:.85}
.motto h2{font-size:clamp(26px,5vw,38px);color:var(--on-pad)}
.motto h2 em{font-style:normal;background:var(--sun);color:var(--sun-ink);border-radius:8px;padding:0 6px}

.takeaways{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tk{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:2px solid var(--line);border-left:6px solid var(--pad);border-radius:14px;padding:12px 14px}
.tk.resp{border-left-color:var(--good)}
.tk-ic{font-size:26px;line-height:1;flex:none;margin-top:2px}
.tk div{display:flex;flex-direction:column;gap:2px;min-width:0}
.tk .mono{font-size:11.5px;color:var(--muted)}
.tk b{font-size:16px}
.tk div > span:last-child{font-size:14.5px;line-height:1.4}
.tk-key{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;border:2px solid var(--pad);color:var(--pad);margin-left:6px}
.tk-key.resp{border-color:var(--good);color:var(--good)}
@media (max-width:560px){.takeaways{grid-template-columns:1fr}}
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:640px){.rules{grid-template-columns:1fr}}
.rules ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.rules li{font-size:16px}

.cert{border:3px solid var(--ink);border-radius:20px;padding:24px;background:var(--card);display:grid;grid-template-columns:120px minmax(0,1fr);gap:20px;align-items:center}
@media (max-width:560px){.cert{grid-template-columns:84px minmax(0,1fr);padding:18px;gap:14px}}
.cert > svg{width:100%;max-width:120px;height:auto;display:block}
.cert > *{min-width:0}
.cert dl{position:relative;margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-variant-numeric:tabular-nums}
.cert dt{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.cert dd{margin:0;font-weight:700;min-width:0;overflow-wrap:anywhere}
.code{font-family:var(--f-mono);font-size:18px;background:var(--sun);color:var(--sun-ink);border-radius:6px;padding:0 6px}

/* Ah Pad */
.ahpad{overflow:visible}
.ap-wiggle{animation:bob 3.2s ease-in-out infinite;transform-origin:100px 230px}
.ap-eyes{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
.ap-shadow{fill:var(--shadow)}
.ap-body{fill:var(--pad)} .ap-screen{fill:var(--screen)} .ap-cam{fill:var(--pad-deep)}
.ap-legs rect{fill:var(--pad-deep)} .ap-shoe{fill:var(--sun)}
.ap-arm{fill:none;stroke:var(--pad-deep);stroke-width:12;stroke-linecap:round}

/* ================= Midnight Case File theme ================= */
body{background:radial-gradient(900px 340px at 50% -80px, rgba(124,92,255,.30), transparent 70%), repeating-linear-gradient(0deg, rgba(255,255,255,.022) 0 1px, transparent 1px 4px), var(--bg);background-color:var(--bg)}
h1,h2,h3{font-family:var(--f-title);font-weight:400;letter-spacing:.02em;line-height:1}
h1{font-size:clamp(46px,9vw,76px);letter-spacing:.01em}
h2{font-size:clamp(30px,5.5vw,42px)}
h3{font-size:23px;letter-spacing:.03em}
.hero h1 span{color:var(--sun)}
.tag{background:none;color:var(--sun);padding:0;border-radius:0;letter-spacing:.08em;flex-wrap:wrap}
.tag em{font-style:normal;color:var(--bad);border:1.5px solid var(--bad);border-radius:4px;padding:0 6px;transform:rotate(-3deg);display:inline-block}
/* timer: red digital display */
.clock{background:#0A0A12;border:2px solid var(--bad);color:#FFB3C1;box-shadow:0 0 0 3px rgba(255,77,109,.15), 0 0 18px rgba(255,77,109,.35)}
.clock b{color:var(--bad);font-size:16px;text-shadow:0 0 8px rgba(255,77,109,.8)}
.clock.calm{border-color:var(--good);color:#B9F7E2;box-shadow:0 0 0 3px rgba(46,230,166,.12), 0 0 16px rgba(46,230,166,.3)}
.clock.calm b{color:var(--good);text-shadow:0 0 8px rgba(46,230,166,.7)}
.clock.urgent{animation:clockpulse 1s ease-in-out infinite;box-shadow:0 0 0 4px rgba(255,77,109,.25), 0 0 26px rgba(255,77,109,.6)}
/* characters and speech */
.stage > svg, .stage svg.chibi, .stage img.mascot{filter:drop-shadow(0 0 18px rgba(124,92,255,.45))}
.bubble{border-color:var(--pad);box-shadow:4px 4px 0 rgba(124,92,255,.35)}
.bubble::before{border-color:var(--pad)}
.bubble .who{font-family:var(--f-title);font-size:23px;letter-spacing:.04em;text-transform:none;color:var(--ink);align-items:baseline}
.bubble .who span{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bubble.chat{border-color:var(--good);box-shadow:4px 4px 0 rgba(46,230,166,.25)}
.bubble.chat::before{border-color:var(--good)}
.bubble.chat .who{color:var(--good)}
.bubble.danger{box-shadow:4px 4px 0 rgba(255,77,109,.3)}
.bubble.danger .who{color:var(--bad)}
/* questions */
.qhead .mono:first-child{color:var(--sun)}
.opt{background:var(--opt)}
.opt .key{background:var(--pad);color:var(--on-pad);border-color:var(--pad)}
.opt.right .key,.opt.right.sel .key{background:var(--good);color:var(--good-ink);border-color:var(--good)}
.fb strong{font-family:var(--f-title);font-weight:400;font-size:26px;letter-spacing:.03em}
.fb.ok{box-shadow:0 0 16px rgba(46,230,166,.18)}
.btn{font-family:var(--f-title);font-weight:400;font-size:24px;letter-spacing:.05em;border-radius:14px;box-shadow:0 4px 0 var(--pad-deep), 0 0 22px rgba(124,92,255,.45)}
.btn:active{box-shadow:0 1px 0 var(--pad-deep), 0 0 14px rgba(124,92,255,.4)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
input[type=text]{background:#0F1020}
.persona .pname{font-family:var(--f-title);font-weight:400;font-size:30px;letter-spacing:.03em}
.persona.sel{box-shadow:0 5px 0 var(--pad-deep), 0 0 24px rgba(124,92,255,.35)}
/* checklist and stamps */
.reason.done .num{color:var(--good-ink)}
.reason .num{font-family:var(--f-mono)}
.vstamp,.stamp{font-family:var(--f-title);font-weight:400;font-size:17px;letter-spacing:.05em;line-height:1.1;text-transform:uppercase;background:transparent;border:2.5px solid currentColor;border-radius:4px;padding:2px 8px;transform:rotate(-5deg)}
.vstamp.clear{color:var(--good)} .vstamp.note{color:var(--sun);background:transparent} .vstamp.key{color:var(--bad);background:transparent}
/* evidence: taped photos on a dark board */
.evi-list{background:#0D0E18;border:1px dashed #3A3F60;border-radius:14px;padding:22px 16px 16px;gap:16px}
.evi{background:var(--paper);color:var(--paper-ink);border:0;border-radius:3px;box-shadow:0 6px 14px rgba(0,0,0,.45)}
.evi .mono{color:var(--paper-muted)}
.evi:nth-child(4n+1){transform:rotate(-1.6deg)} .evi:nth-child(4n+2){transform:rotate(1.2deg)} .evi:nth-child(4n+3){transform:rotate(-.8deg)} .evi:nth-child(4n){transform:rotate(1.6deg)}
.evi::before{content:"";position:absolute;top:-8px;left:50%;width:48px;height:14px;margin-left:-24px;background:rgba(255,210,63,.75);transform:rotate(-4deg)}
.evi .stamp.clear{color:#1E8F65} .evi .stamp.note{color:#8A6400} .evi .stamp.key{color:#D81E45}
.evi.v-sus::before,.evi.v-reason::before{width:13px;height:13px;margin-left:-6.5px;top:-6px;border-radius:50%;background:var(--bad);box-shadow:0 2px 0 #9E1F3A;transform:none}
.evi.v-sus:has(+ .evi.v-reason)::after{content:"";position:absolute;top:0;left:50%;width:calc(100% + 16px);height:2px;background:var(--bad);transform:rotate(2.5deg);transform-origin:left center;box-shadow:0 0 6px rgba(255,77,109,.7);z-index:1}
@media (max-width:560px){.evi.v-sus:has(+ .evi.v-reason)::after{display:none}}
.evi.big{transform:none;border:0;box-shadow:0 8px 20px rgba(0,0,0,.5)}
/* summary and certificate */
.motto{background:linear-gradient(135deg, #7C5CFF, #4E33C9);box-shadow:0 0 30px rgba(124,92,255,.35)}
.motto h2{line-height:1.05}
.tk{background:var(--opt)}
.tk .mono{color:var(--sun)}
.cert{border-color:var(--pad);box-shadow:0 0 26px rgba(124,92,255,.25)}
.chip.right{color:var(--good-ink)}
.meter-bar i{box-shadow:0 0 10px rgba(124,92,255,.7)}
.checking .mono{color:var(--sun)}
@media (prefers-reduced-motion: reduce){.clock.urgent{animation:none}}

const fresh = () => ({view:"persona", persona:null, step:0, name:"", scene:0, q:0, score:0, done:[], picked:[], answered:false, lastOk:null, tries:0, wrong:[], failed:false, restarts:0, dstep:0, deduced:[null,null], finishedAt:null, startAt:null, solvedAt:null, timeouts:0});
const CLEAN = {picked:[], answered:false, lastOk:null, tries:0, wrong:[], failed:false};
let S = fresh();
const KEY = "ahpad-case-v3";
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = () => Math.round(S.done.length / SCENES.length * 100);

const LIMIT = 20*60*1000; // 20 real minutes: 7:40 am to 8:00 am
const RUNNING = ["board","sceneIntro","question","reveal","deduce"];
function msLeft(){ if(!S.startAt) return LIMIT; const end = S.solvedAt || Date.now(); return Math.max(0, LIMIT - (end - S.startAt)); }
function storyTime(ms){ const el = LIMIT - ms; const m = 40 + Math.floor(el/60000); return m >= 60 ? "08:00" : "07:" + String(m).padStart(2,"0"); }
function mmss(ms){ const t = Math.ceil(ms/1000); return Math.floor(t/60) + ":" + String(t%60).padStart(2,"0"); }
function clockText(){
  if(S.view==="timeup") return {t:"08:00", left:"Time's up", cls:""};
  const ms = msLeft();
  if(S.view==="verdict" || S.view==="end") return {t:storyTime(ms), left:"Case closed", cls:"calm"};
  if(!S.startAt) return {t:"07:40", left:"Wipe in 20 mins", cls:"calm"};
  return {t:storyTime(ms), left:"Wipe in " + mmss(ms), cls: ms <= 5*60000 ? "urgent" : ""};
}
function tick(){
  if(!S.startAt || S.solvedAt || !RUNNING.includes(S.view)) return;
  if(msLeft() <= 0){ S.view = "timeup"; render(); try{ window.scrollTo(0,0); }catch(e){} return; }
  const el = document.getElementById("clock"); if(!el) return;
  const c = clockText(); el.className = "clock " + c.cls; el.innerHTML = `<span>${c.t}</span><b>${c.left}</b>`;
}
setInterval(tick, 1000);

}

  let body = "";

    body = `<div class="opts">${q.options.map((o,i)=>{
      let c = "", dis = S.answered;

}

};
const P = () => PERSONAS[S.persona] || PERSONAS.boy;
const OWNER = {name:"Mark", cn:"", slug:"mark", init:"MK", their:"his"};
const BASE = JSON.stringify({CAST, VERDICTS, SCENES, DEDUCE, VERDICT, INTRO, BOARD_LINES});
function applyPersona(){
  const o = OWNER, p = P(); // o = Ah Pad's owner (always Mark), p = the player, the Tech Champion (the chosen mascot)
  const txt = BASE.split("Xiao Nan").join("\u0001").split("小南").join(o.cn).split("xiaonan").join(o.slug)
    .split("{their}").join(o.their).split("{INIT}").join(o.init).split("\u0001").join(o.name).split("Kai").join(p.name);
  ({CAST, VERDICTS, SCENES, DEDUCE, VERDICT, INTRO, BOARD_LINES} = JSON.parse(txt));
}
function vPersona(){
  return `${topBar()}
  <div class="hero"><span class="tag">Case file #103 · Nan Hua High School · WizHub <em>Confidential</em></span><h1>The Case of <span>Ah Pad</span></h1><p class="muted">A detective mystery about using your iPad the right way. About 20 minutes.</p></div>
  <section><h2>Choose your character</h2><p class="muted">You play as a <b>Tech Champion</b> on duty at WizHub. Your schoolmate Mark needs your help to find out why his iPad, Ah Pad, was summoned.</p>
  <div class="personas">${["boy","girl"].map(k=>{ const p = PERSONAS[k]; return `<button class="persona ${S.persona===k?"sel":""}" data-act="pickPersona" data-k="${k}" aria-pressed="${S.persona===k}">
      <img src="${p.img}" alt="${p.name}, Nan Hua High School mascot">
      <span class="pname">${p.name} <span lang="zh">${p.cn}</span></span>
      <span class="pcheck">${S.persona===k?"✓ Selected":"Tap to choose"}</span></button>`; }).join("")}</div></section>
  <div class="row"><button class="btn" data-act="personaGo" ${S.persona?"":"disabled"}>${S.persona?"Start as "+PERSONAS[S.persona].name:"Choose a character first"}</button></div>`;
}

/* ---------- Render & events ---------- */
function render(signErr){
  const views = {persona:vPersona, intro:vIntro, signin:()=>vSignin(signErr), board:vBoard, sceneIntro:vSceneIntro, question:vQuestion, reveal:vReveal, deduce:vDeduce, verdict:vVerdict, end:vEnd, timeup:vTimeUp};
  app.innerHTML = (views[S.view] || vPersona)();
  save();
}
function go(view, extra){ Object.assign(S,{view},extra||{}); render(); try{ window.scrollTo(0,0); }catch(e){} }

app.addEventListener("submit", e=>{
  if(e.target.id!=="signin") return;
  e.preventDefault();
  const cls = document.getElementById("dclass").value.replace(/\s+/g,"").toUpperCase();
  const full = document.getElementById("dname").value.trim().replace(/\s+/g," ");
  S.name = (cls + " " + full).trim();
  const err = {};
  if(!/^\d[A-Z0-9]{1,4}$/.test(cls)) err.cls = "Enter your class, e.g. 101.";
  if(full.length < 2) err.name = "Enter your full name.";
  if(err.cls || err.name){ render(err); document.getElementById(err.cls ? "dclass" : "dname").focus(); return; }
  go("board", {startAt: S.startAt || Date.now()});
});

app.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if(!b) return;
  const act = b.dataset.act, i = +b.dataset.i;
  const s = SCENES[S.scene], q = s && s.qs[S.q];
  switch(act){
    case "pickPersona": S.persona = b.dataset.k; applyPersona(); render(); break;
    case "personaGo": if(!S.persona) return; applyPersona(); go("intro",{step:0}); break;
    case "introNext": if(S.step<INTRO.length-1){ S.step++; render(); } else go("signin",{step:0}); break;
    case "introBack": S.step--; render(); break;
    case "restart": S = fresh(); applyPersona(); try{localStorage.removeItem(KEY);}catch(_){} render(); break;
    case "openScene": go("sceneIntro",Object.assign({scene:i,step:0,q:0},CLEAN)); break;
    case "cutNext": if(S.step < s.cut.length-1){ S.step++; render(); } else go("question",Object.assign({q:0},CLEAN)); break;
    case "cutBack": S.step--; render(); break;
    case "mc": {
      if(S.answered || S.wrong.includes(i)) return;
      S.picked=[i];
      if(i===q.answer){ S.answered=true; S.lastOk=true; if(S.tries===0) S.score++; }
      else if(S.tries===0){ S.tries=1; S.wrong=[i]; S.lastOk=false; }
      else { S.answered=true; S.lastOk=false; S.failed=true; S.wrong.push(i); }
      render(); break; }
    case "toggle":
      if(S.answered) return;
      S.picked = S.picked.includes(i) ? S.picked.filter(x=>x!==i) : S.picked.concat([i]); render(); break;
    case "flag": {
      if(S.answered) return;
      const id = b.dataset.id;
      S.picked = S.picked.includes(id) ? S.picked.filter(x=>x!==id) : S.picked.concat([id]); render(); break; }
    case "check": {
      let ok;
      if(q.type==="multi") ok = q.options.every((o,k)=>o.ok === S.picked.includes(k));
      else ok = q.items.every(it=>it.bad === S.picked.includes(it.id));
      if(ok){ S.answered=true; S.lastOk=true; if(S.tries===0) S.score++; }
      else if(S.tries===0){ S.tries=1; S.lastOk=false; }
      else { S.answered=true; S.lastOk=false; S.failed=true; }
      render(); break; }
    case "nextQ":
      if(S.q < s.qs.length-1) go("question",Object.assign({q:S.q+1},CLEAN));
      else { if(!S.done.includes(S.scene)) S.done.push(S.scene); go("reveal"); }
      break;
    case "bounce":
      go("board",Object.assign({done:[], score:0, scene:0, q:0, dstep:0, deduced:[null,null], restarts:S.restarts+1},CLEAN));
      break;
    case "toBoard": go("board"); break;
    case "toDeduce": go("deduce",Object.assign({dstep:0, deduced:[null,null]},CLEAN)); break;
    case "deduce": {
      if(S.deduced[S.dstep]!==null || S.wrong.includes(i)) return;
      const d = DEDUCE[S.dstep];
      if(i===d.answer){ S.deduced[S.dstep]=i; if(S.tries===0) S.score++; }
      else if(S.tries===0){ S.tries=1; S.wrong=[i]; }
      else { S.deduced[S.dstep]=i; S.failed=true; S.wrong.push(i); }
      render(); break; }
    case "deduceNext":
      if(S.dstep===0) go("deduce",Object.assign({dstep:1},CLEAN)); else go("verdict",{step:0, solvedAt: S.solvedAt || Date.now()});
      break;
    case "timeRetry":
      go("board",Object.assign({done:[], score:0, scene:0, q:0, dstep:0, deduced:[null,null], restarts:S.restarts+1, timeouts:S.timeouts+1, startAt:Date.now(), solvedAt:null},CLEAN));
      break;
    case "verdictNext":
      if(S.step<VERDICT.length-1){ S.step++; render(); }
      else go("end",{finishedAt: S.finishedAt || Date.now()});
      break;
  }
});

function start(data){
  const saved = (data && data.view) ? data : load();
  if(saved) S = Object.assign(fresh(), saved);
  applyPersona();
  render();
}
try { window.claude?.hot?.snapshot?.(()=>S); } catch(e) {}
let hotData = {};
try { hotData = window.claude?.hot?.data ?? {}; } catch(e) {}
try { start(hotData); } catch(e) { S = fresh(); render(); }
</script>
